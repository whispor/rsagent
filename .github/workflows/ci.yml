name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform going red must not hide the others' results.
      # 一个平台失败不应掩盖另外两个的结果。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Public docs are part of the contract (see STABILITY.md), so a broken intra-doc link
  # or an undocumented item must fail the build rather than be found by a reader later.
  # One OS is enough: rustdoc output is not platform-specific.
  # 公开文档是契约的一部分（见 STABILITY.md）：断链或未文档化的条目必须让构建失败，而不是
  # 被读者事后发现。一个平台足矣——rustdoc 输出不随平台而变。
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Build docs (warnings denied)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The declared MSRV is a promise, so build the whole workspace on it. Kept separate
  # from `check` (which runs on stable) because rustfmt/clippy output is toolchain-
  # specific; only the plain compiler needs to hold at the floor.
  # 声明的 MSRV 是一项承诺，因此在它上面构建整个 workspace。与跑 stable 的 `check` 分开，
  # 因为 rustfmt/clippy 的输出随工具链而变；只有编译器本身需要在最低版本上成立。
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Check at MSRV
        run: cargo check --workspace --all-targets --locked
